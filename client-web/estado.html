<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoverAO — quién está jugando</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23281a0a'/%3E%3Cpath d='M16 5l3 8h8l-6.5 5 2.5 8-7-5-7 5 2.5-8L5 13h8z' fill='%23e8c876'/%3E%3C/svg%3E" />
  <style>
    /* La paleta y las fuentes son las del cliente (index.html): esta página se abre desde el login y se
       vuelve al login, así que verse como otro sitio sería raro. Va SUELTA a propósito —sin compartir CSS con
       el cliente— porque tiene que poder abrirse aunque el juego no cargue: es justo la página que uno mira
       cuando algo no anda. */
    :root {
      --bg:#08060a; --ink:#e8dcc0; --ink-dim:#b6a882;
      --gold:#e8c876; --gold-lo:#9a7326; --gold-deep:#5c3f15;
      --wood:#2a1c0e; --wood-hi:#3d2a15; --wood-lo:#1a1108;
      --serif:'Trajan Pro','Cinzel','Georgia',serif;
    }
    /* LAS BARRAS DE DESPLAZAMIENTO, oscuras y doradas: las de Chrome por defecto son blancas y se veían "feas" abiertas encima
       del juego (el autor, 05/10). */
    html { color-scheme: dark; scrollbar-color: #5c3f15 #120c06; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #120c06; }
    ::-webkit-scrollbar-thumb { background: #5c3f15; border-radius: 5px; border: 2px solid #120c06; }
    ::-webkit-scrollbar-thumb:hover { background: #9a7326; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:system-ui, sans-serif; font-size:15px; line-height:1.5;
      background-image: radial-gradient(120% 120% at 50% -10%, #17110c 0%, #0a0708 55%, #050405 100%); }
    main { max-width:920px; margin:0 auto; padding:24px 16px 48px; }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between;
      border-bottom:1px solid var(--gold-deep); padding-bottom:12px; margin-bottom:20px; }
    h1 { font-family:var(--serif); color:var(--gold); font-size:26px; margin:0; letter-spacing:.04em; }
    h2 { font-family:var(--serif); color:var(--gold); font-size:18px; margin:28px 0 10px; letter-spacing:.03em; }
    a { color:var(--gold); }
    .sub { color:var(--ink-dim); font-size:13px; }
    .panel { background:linear-gradient(180deg, var(--wood-hi), var(--wood) 40%, var(--wood-lo));
      border:1px solid var(--gold-lo); border-radius:3px; box-shadow:inset 0 0 0 1px #000, inset 0 0 14px #000a;
      padding:4px; }
    /* La tabla puede no entrar en un teléfono: scrollea ELLA, no la página. */
    .scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; color:var(--gold); font-weight:600; font-size:12px; text-transform:uppercase;
      letter-spacing:.06em; padding:8px 10px; border-bottom:1px solid var(--gold-deep); white-space:nowrap; }
    td { padding:7px 10px; border-bottom:1px solid #0006; white-space:nowrap; }
    tr:last-child td { border-bottom:none; }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .nombre { color:var(--gold); font-weight:600; }
    .clan { color:var(--ink-dim); }
    .gm { color:#7ed06a; font-size:11px; border:1px solid #4a9b3a; border-radius:3px; padding:0 4px; margin-left:6px; }
    .vacio { color:var(--ink-dim); padding:18px 10px; }
    .pie { margin-top:28px; color:var(--ink-dim); font-size:12px; }
    .puntito { display:inline-block; width:8px; height:8px; border-radius:50%; background:#4a9b3a;
      margin-right:6px; vertical-align:baseline; }
    .caido { background:#c0392b; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>CoverAO</h1>
      <div class="sub" id="resumen">cargando…</div>
    </div>
    <div><a href="./" id="al-juego">← entrar al juego</a></div>
  </header>

  <h2><span class="puntito" id="luz"></span>Conectados ahora</h2>
  <div class="panel"><div class="scroll"><table>
    <thead><tr><th>Personaje</th><th class="num">Nivel</th><th>Clase</th><th>Clan</th></tr></thead>
    <tbody id="online"></tbody>
  </table></div></div>

  <h2>Tabla de posiciones</h2>
  <div class="panel"><div class="scroll"><table>
    <thead><tr>
      <th class="num">#</th><th>Personaje</th><th class="num">Nivel</th><th>Clase</th><th>Clan</th>
      <th class="num">Criaturas</th><th class="num">Usuarios</th><th class="num">Muertes</th>
    </tr></thead>
    <tbody id="ranking"></tbody>
  </table></div></div>

  <p class="pie" id="pie">Los administradores no entran en la tabla de posiciones.</p>
</main>

<script>
(() => {
  'use strict';

  // TODO EL TEXTO ENTRA POR textContent, nunca por innerHTML. Los nombres de personaje y de clan los escribe
  // un jugador: son la única entrada no confiable de esta página, y armar filas con plantillas de string es
  // exactamente como se cuela un <script> en la pantalla de todos los demás.
  const celda = (texto, clase) => {
    const td = document.createElement('td');
    td.textContent = texto;
    if (clase) td.className = clase;
    return td;
  };
  const fila = (celdas) => {
    const tr = document.createElement('tr');
    for (const c of celdas) tr.appendChild(c);
    return tr;
  };
  const vaciar = (el) => { while (el.firstChild) el.removeChild(el.firstChild); };
  const mensaje = (cuerpo, columnas, texto) => {
    vaciar(cuerpo);
    const td = celda(texto, 'vacio');
    td.colSpan = columnas;
    cuerpo.appendChild(fila([td]));
  };

  const enOnline = document.getElementById('online');
  const enRanking = document.getElementById('ranking');
  const enResumen = document.getElementById('resumen');
  const luz = document.getElementById('luz');

  const plural = (n, uno, muchos) => n + ' ' + (n === 1 ? uno : muchos);

  function tiempo(seg) {
    const d = Math.floor(seg / 86400), h = Math.floor(seg % 86400 / 3600), m = Math.floor(seg % 3600 / 60);
    if (d > 0) return plural(d, 'día', 'días') + ' y ' + plural(h, 'hora', 'horas');
    if (h > 0) return plural(h, 'hora', 'horas') + ' y ' + plural(m, 'minuto', 'minutos');
    return plural(m, 'minuto', 'minutos');
  }

  function pintar(estado) {
    luz.classList.remove('caido');
    const s = estado.servidor || {};
    enResumen.textContent = plural(s.online || 0, 'jugador conectado', 'jugadores conectados')
      + ' · encendido hace ' + tiempo(s.uptimeSec || 0)
      + (s.version ? ' · versión ' + s.version : '');

    const online = estado.online || [];
    if (!online.length) mensaje(enOnline, 4, 'No hay nadie conectado en este momento.');
    else {
      vaciar(enOnline);
      for (const p of online) {
        const nom = celda(p.nombre, 'nombre');
        if (p.gm) { const t = document.createElement('span'); t.className = 'gm'; t.textContent = 'GM'; nom.appendChild(t); }
        enOnline.appendChild(fila([nom, celda(p.nivel, 'num'), celda(p.clase), celda(p.clan || '—', 'clan')]));
      }
    }

    const ranking = estado.ranking || [];
    if (!ranking.length) mensaje(enRanking, 8, 'Todavía no hay personajes. El primero que juegue encabeza la tabla.');
    else {
      vaciar(enRanking);
      for (const r of ranking) {
        enRanking.appendChild(fila([
          celda(r.puesto, 'num'), celda(r.nombre, 'nombre'), celda(r.nivel, 'num'),
          celda(r.clase), celda(r.clan || '—', 'clan'),
          celda(r.criaturas, 'num'), celda(r.usuarios, 'num'), celda(r.muertes, 'num'),
        ]));
      }
    }
  }

  function caido(texto) {
    luz.classList.add('caido');
    enResumen.textContent = texto;
    mensaje(enOnline, 4, '—');
    mensaje(enRanking, 8, '—');
  }

  async function refrescar() {
    try {
      const r = await fetch('./api/publico.json', { cache: 'no-store' });
      // 404 = el host la apagó con `PaginaPublica=0` en su Server.ini. Es una respuesta válida del servidor,
      // no una caída, y decir "no se pudo conectar" mandaría a revisar la red por nada.
      if (r.status === 404) { caido('Este servidor tiene la página pública apagada.'); return; }
      if (!r.ok) { caido('El servidor contestó ' + r.status + '.'); return; }
      pintar(await r.json());
    } catch (e) {
      caido('No se pudo conectar con el servidor.');
    }
  }

  refrescar();
  // Diez segundos: el armador del lado del servidor cachea cinco, así que pedirlo más seguido no traería
  // nada más nuevo y sí multiplicaría el tráfico de una pestaña que la gente deja abierta.
  setInterval(refrescar, 10000);
})();
</script>
  <script>
    // ABIERTA ENCIMA DE OTRA PÁGINA, "entrar al juego" no carga el juego adentro del recuadro: le avisa a la de afuera. En el
    // ingreso (index.html) cierra la capa; en el menú del juego de escritorio entra a este server. Va a cualquier origen porque
    // el menú es una página local (file://); el mensaje no lleva nada más que el aviso, y cada una mira de dónde viene.
    if (window.parent !== window) {
      document.getElementById('al-juego').addEventListener('click', (e) => {
        e.preventDefault();
        window.parent.postMessage('coverao:cerrar-top', '*');
      });
    }
  </script>
</body>
</html>

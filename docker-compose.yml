# CoverAO con docker compose.
#
#   docker compose up -d          # levanta el servidor
#   docker compose logs -f        # ver el log
#   docker compose down           # apagarlo (limpio: manda SIGTERM y el server guarda a todos)
#
# Despues, a jugar en  http://localhost:7669/ .

services:
  coverao:
    build: .
    image: coverao
    container_name: coverao
    restart: unless-stopped

    ports:
      - "7666:7666"   # juego (protocolo AO clasico, para el cliente de Windows)
      - "7667:7667"   # WebSocket — por aca JUEGA el cliente web. Sin este puerto la pagina carga y no conecta.
      - "7669:7669"   # cliente web (la URL que abren los jugadores)
      # El 7668 (panel de administracion) se publica SOLO en el 127.0.0.1 de esta maquina: desde afuera no se
      # llega. Desde la tuya, con un tunel SSH
      #   ssh -L 7668:localhost:7668 usuario@servidor
      # y despues abri http://localhost:7668/ en tu maquina. El token:
      #   docker compose exec coverao cat /app/data/admin-token.txt
      - "127.0.0.1:7668:7668"

    volumes:
      # Las cuentas y los personajes. Es LO UNICO que no se puede volver a generar: sin este volumen,
      # actualizar la imagen borra el servidor entero.
      - coverao-data:/app/data

    environment:
      # Cualquier clave del Server.ini se pisa con COVERAO_<SECCION>_<CLAVE>. Adentro de un contenedor esta
      # es la forma natural de configurar: no hay que montar un archivo para cambiar un numero.
      # El servidor imprime al arrancar cuales le llegaron por entorno.
      - COVERAO_INIT_MAXUSERS=200
      - COVERAO_INIT_EXP=1            # 1 = normal: multiplican directo, como el Server.ini.ejemplo
      - COVERAO_INIT_ORO=1
      # LAS REGLAS DE LA CASA. La imagen NO lleva Server.ini a proposito, asi que sin estas dos lineas un
      # despliegue por Docker arranca con las tres APAGADAS —o sea como el VB6— mientras que el paquete .zip
      # las trae prendidas: el mismo servidor jugaria distinto segun como lo levantes. Se vio corriendo la
      # imagen, no leyendo el Dockerfile.
      - COVERAO_INIT_CURAALSUBIRNIVEL=1     # subir de nivel cura del todo
      - COVERAO_INIT_QUITAREQUIPONOVATO=1   # al dejar de ser novato desaparece SOLO el equipo de novato
      # SER GM. Van las dos: el contador vive en [INIT] y el nombre en [Dioses], igual que en el archivo,
      # y es el nombre del PERSONAJE, no el de la cuenta. Toma efecto al reiniciar el contenedor: sin
      # Server.ini en disco el server no tiene donde escribir, asi que ni el panel ni /SETINIVAR pueden dar
      # rangos aca -- si hace falta cambiarlos en caliente, monta tu propio archivo en /app/Server.ini.
      # - COVERAO_INIT_DIOSES=1
      # - COVERAO_DIOSES_DIOS1=NombreDeTuPersonaje
      # - COVERAO_INIT_OROALSUBIRNIVEL=500  # apagada por decision del autor
      # PARA SER GM hacen falta las dos: prender la lista y poner tu personaje en ella.
      # - COVERAO_INIT_DIOSES=1
      # - COVERAO_DIOSES_DIOS1=TuPersonaje

    # `docker stop` manda SIGTERM y el server guarda a todos los conectados antes de salir. El default de
    # 10 s puede quedar corto con el mundo lleno, y si vence, Docker manda SIGKILL y se pierde lo no guardado.
    stop_grace_period: 60s

volumes:
  coverao-data:
